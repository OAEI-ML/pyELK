name: Distribution matrix

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONSAFEPATH: "1"

jobs:
  source-artifacts:
    name: Source distribution and universal fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned build frontend
        run: >-
          python -m pip install
          build==1.5.0 setuptools==83.0.0 setuptools-rust==1.13.0 wheel==0.46.3

      - name: Set reproducible archive timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Validate dependency inventory, legal selections, and SBOMs
        run: >-
          python -m tools.supply_chain --check
          --output-dir reports/release/0.1.0.dev0

      - name: Build the reproducible sdist and explicit zero-extension wheel twice
        env:
          PYELK_BUILD_PURE: "1"
          PYELK_REQUIRE_NATIVE: "0"
        run: |
          python -m build --sdist --wheel --no-isolation --outdir dist
          python -m build --sdist --wheel --no-isolation --outdir rebuilt
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -name '*-py3-none-any.whl' | wc -l)" -eq 1
          cmp dist/*.tar.gz rebuilt/*.tar.gz
          cmp dist/*-py3-none-any.whl rebuilt/*-py3-none-any.whl

      - name: Audit source and fallback artifacts
        run: |
          python tools/check_artifact.py check dist/*.tar.gz --expect sdist
          python tools/check_artifact.py check dist/*-py3-none-any.whl --expect pure-wheel

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-evidence
          path: reports/release/0.1.0.dev0/*.json
          if-no-files-found: error
          retention-days: 7

  compiler-free-installed:
    name: Compiler/JRE-free / Python ${{ matrix.python }}
    needs: source-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-artifacts
          path: artifacts

      - name: Prepare the complete offline wheelhouse
        run: >-
          python -m pip download --dest wheelhouse --only-binary=:all:
          "pyowl-core>=0.1,<0.2" "setuptools>=77,<84"
          setuptools-rust==1.13.0 "wheel>=0.45,<0.47"

      - name: Install universal wheel with no compiler or Java
        run: >-
          python tests/packaging/install_artifact.py
          artifacts/*-py3-none-any.whl --python "$(command -v python)"
          --wheelhouse wheelhouse --expected-backend python
          --expected-core-backend python --expected-ingestion scalar-python

      - name: Install sdist with no Cargo, C/C++ compiler, or Java
        run: >-
          python tests/packaging/install_artifact.py
          artifacts/*.tar.gz --python "$(command -v python)"
          --wheelhouse wheelhouse --expected-backend python
          --expected-core-backend python --expected-ingestion scalar-python

  native-wheels:
    name: Native / ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
            build: "cp310-{manylinux,musllinux}_x86_64"
            arch: x86_64
            macos-target: "10.12"
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
            build: "cp310-{manylinux,musllinux}_aarch64"
            arch: aarch64
            macos-target: "10.12"
          - id: macos-x86_64
            runner: macos-15-intel
            build: "cp310-macosx_x86_64"
            arch: x86_64
            macos-target: "10.12"
          - id: macos-arm64
            runner: macos-14
            build: "cp310-macosx_arm64"
            arch: arm64
            macos-target: "11.0"
          - id: windows-amd64
            runner: windows-latest
            build: "cp310-win_amd64"
            arch: AMD64
            macos-target: "10.12"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Pin host Rust toolchain
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Build, repair, ABI-audit, and test native wheel
        uses: pypa/cibuildwheel@a0a973acdc9e7b7f8b04ac5c80e6883a5a102615 # v4.1.0
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_MACOS: >-
            PYELK_BUILD_PURE=0 PYELK_REQUIRE_NATIVE=1 CARGO_TERM_COLOR=always
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-target }}
        with:
          output-dir: wheelhouse

      - name: Install pinned Linux ABI and dependency auditors
        if: runner.os == 'Linux'
        run: python -m pip install abi3audit==0.0.26 auditwheel==6.7.0

      - name: Install pinned macOS ABI and dependency auditors
        if: runner.os == 'macOS'
        run: python -m pip install abi3audit==0.0.26 delocate==0.13.0

      - name: Install pinned Windows ABI and dependency auditors
        if: runner.os == 'Windows'
        run: python -m pip install abi3audit==0.0.26 delvewheel==1.13.0

      - name: Enforce archive, ABI, JVM, path, and shared-library policy
        shell: bash
        run: |
          for wheel in wheelhouse/*.whl; do
            python tools/check_artifact.py check "$wheel" --expect native-wheel --external
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.id }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  abi3-supported-cpython:
    name: ABI3 Python ${{ matrix.python }} / ${{ matrix.lane }}
    needs: native-wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        lane:
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-arm64
          - windows-amd64
        include:
          - lane: linux-x86_64
            runner: ubuntu-24.04
            pattern: "*manylinux*x86_64.whl"
          - lane: linux-aarch64
            runner: ubuntu-24.04-arm
            pattern: "*manylinux*aarch64.whl"
          - lane: macos-x86_64
            runner: macos-15-intel
            pattern: "*macosx*x86_64.whl"
          - lane: macos-arm64
            runner: macos-14
            pattern: "*macosx*arm64.whl"
          - lane: windows-amd64
            runner: windows-latest
            pattern: "*win_amd64.whl"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-${{ matrix.lane }}
          path: native

      - name: Prepare runtime dependency wheelhouse
        shell: bash
        run: >-
          python -m pip download --dest wheelhouse --only-binary=:all:
          "pyowl-core>=0.1,<0.2"

      - name: Exercise ABI3 wheel with Rust and forced Python
        shell: bash
        env:
          WHEEL_PATTERN: ${{ matrix.pattern }}
        run: |
          wheel="$(find native -name "$WHEEL_PATTERN" -print -quit)"
          test -n "$wheel"
          python tests/packaging/install_artifact.py "$wheel" --python "$(command -v python)" --wheelhouse wheelhouse --expected-backend rust --expected-core-backend python --expected-ingestion scalar-wire
          python tests/packaging/install_artifact.py "$wheel" --python "$(command -v python)" --wheelhouse wheelhouse --expected-backend python --expected-core-backend python --expected-ingestion scalar-python --force-python

  musllinux-supported-cpython:
    name: ABI3 Python ${{ matrix.python }} / musllinux ${{ matrix.arch }}
    needs: native-wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            lane: linux-x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            lane: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-${{ matrix.lane }}
          path: native

      - name: Download universal runtime dependency
        run: >-
          python -m pip download --dest wheelhouse --only-binary=:all:
          "pyowl-core>=0.1,<0.2"

      - name: Exercise musllinux wheel on native hardware
        env:
          ARCH: ${{ matrix.arch }}
          PYTHON_IMAGE: python:${{ matrix.python }}-alpine
        run: |
          docker run --rm -v "$PWD:/project" -w /tmp "$PYTHON_IMAGE" sh -ec '
            python -m venv /tmp/venv
            /tmp/venv/bin/python -m pip install --no-index --find-links /project/wheelhouse /project/native/*musllinux*'"$ARCH"'.whl
            /tmp/venv/bin/python /project/tests/packaging/installed_smoke.py --expected-backend rust --expected-core-backend python --expected-ingestion scalar-wire
            /tmp/venv/bin/python /project/tests/packaging/installed_smoke.py --expected-backend python --expected-core-backend python --expected-ingestion scalar-python --force-python
          '

  artifact-consistency:
    name: Complete staged artifact set
    needs:
      - source-artifacts
      - compiler-free-installed
      - native-wheels
      - abi3-supported-cpython
      - musllinux-supported-cpython
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-artifacts"
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "native-*"
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: supply-chain-evidence
          path: supply-chain

      - name: Require the exact tier-one set and compare every native wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          artifacts = Path("artifacts")
          pure = tuple(artifacts.glob("*-py3-none-any.whl"))
          native = tuple(artifacts.glob("*-cp310-abi3-*.whl"))
          sdist = tuple(artifacts.glob("*.tar.gz"))
          assert (len(pure), len(native), len(sdist)) == (1, 7, 1), (pure, native, sdist)
          PY
          python tools/check_artifact.py check artifacts/*.tar.gz --expect sdist
          python tools/check_artifact.py check artifacts/*-py3-none-any.whl --expect pure-wheel
          for wheel in artifacts/*-cp310-abi3-*.whl; do
            python tools/check_artifact.py check "$wheel" --expect native-wheel
            python tools/check_artifact.py compare artifacts/*-py3-none-any.whl "$wheel"
          done

      - name: Revalidate the staged dependency and SBOM evidence
        run: >-
          python -m tools.supply_chain --check --require-approval
          --output-dir supply-chain

      - name: Verify local-index wheel preference
        run: python tests/packaging/check_index_preference.py --index artifacts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: |
            artifacts/*.whl
            artifacts/*.tar.gz
            supply-chain/*.json
          if-no-files-found: error
          retention-days: 7
