[build-system]
requires = [
  "setuptools>=77,<84",
  "setuptools-rust==1.13.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyelk-reasoner"
version = "0.2.0"
description = "ELK-compatible OWL 2 EL reasoning in pure Python with optional Rust acceleration"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.pyelk", "THIRD_PARTY_LICENSES/*"]
authors = [
  { name = "pyELK contributors" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pyowl-core>=0.2,<0.3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.100,<7",
  "import-linter>=2.1,<3",
  "mypy>=1.10,<3",
  "packaging>=24,<27",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]

[project.urls]
Homepage = "https://github.com/OAEI-ML/pyELK"
Documentation = "https://github.com/OAEI-ML/pyELK/tree/main/docs"
Repository = "https://github.com/OAEI-ML/pyELK"
Issues = "https://github.com/OAEI-ML/pyELK/issues"
Specifications = "https://github.com/OAEI-ML/pyELK/tree/main/specs"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyelk = ["py.typed"]

[tool.cibuildwheel]
build = "cp310-*"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_i686"]
build-frontend = "build"
environment = { PYELK_BUILD_PURE = "0", PYELK_REQUIRE_NATIVE = "1", CARGO_TERM_COLOR = "always" }
before-test = "python -m pip install 'hypothesis>=6.100,<7' 'import-linter>=2.1,<3' 'pytest>=8.2,<10'"
test-command = "python {project}/tests/packaging/run_installed_wp14_contract.py && python {project}/tests/packaging/run_installed_suite.py --backend rust --core-backend native --expected-ingestion encoded-native && python {project}/tests/packaging/run_installed_suite.py --backend python --core-backend native --expected-ingestion scalar-python"

[[tool.cibuildwheel.overrides]]
select = "*-manylinux*"
test-command = "python {project}/tests/packaging/run_installed_wp14_contract.py && python {project}/tests/packaging/run_installed_suite.py --backend rust --core-backend python --expected-ingestion encoded-native && python {project}/tests/packaging/run_installed_suite.py --backend python --core-backend python --expected-ingestion scalar-python"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
test-command = "python {project}/tests/packaging/run_installed_wp14_contract.py && python {project}/tests/packaging/run_installed_suite.py --backend rust --core-backend python --expected-ingestion encoded-native && python {project}/tests/packaging/run_installed_suite.py --backend python --core-backend python --expected-ingestion scalar-python"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
before-all = """
set -eu
rustup_version=1.28.2
rust_toolchain=1.97.1
musllinux_rust=1.87.0-r1
musllinux_cargo=1.87.0-r1
if ldd --version 2>&1 | grep -qi musl; then
  apk add --no-cache "rust=$musllinux_rust" "cargo=$musllinux_cargo"
else
  case "$(uname -m)" in
    x86_64)
      rustup_host=x86_64-unknown-linux-gnu
      rustup_sha256=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
      ;;
    aarch64)
      rustup_host=aarch64-unknown-linux-gnu
      rustup_sha256=e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
      ;;
    *)
      echo "unsupported rustup host: $(uname -m)" >&2
      exit 1
      ;;
  esac
  rustup_directory="$(mktemp -d)"
  rustup_installer="$rustup_directory/rustup-init"
  curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
    --output "$rustup_installer" \
    "https://static.rust-lang.org/rustup/archive/$rustup_version/$rustup_host/rustup-init"
  printf '%s  %s\n' "$rustup_sha256" "$rustup_installer" | sha256sum -c
  chmod 0755 "$rustup_installer"
  "$rustup_installer" -y --default-toolchain "$rust_toolchain" --profile minimal --no-modify-path
fi
"""
environment = { PYELK_BUILD_PURE = "0", PYELK_REQUIRE_NATIVE = "1", CARGO_TERM_COLOR = "always", PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
environment = { PYELK_BUILD_PURE = "0", PYELK_REQUIRE_NATIVE = "1", CARGO_TERM_COLOR = "always", MACOSX_DEPLOYMENT_TARGET = "10.12" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
testpaths = ["tests"]
xfail_strict = true
markers = [
  "java_oracle: requires the opt-in pinned Java oracle",
  "packaging: installed-artifact and build tests",
  "performance: non-functional benchmark gate",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pyelk", "tests"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests/helpers", "tests/unit"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.importlinter]
root_package = "pyelk"
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "values-no-backends"
name = "OWL, parsing, indexing, and public result values do not depend on backends"
type = "forbidden"
source_modules = [
  "pyelk.core",
  "pyelk.owl",
  "pyelk.indexing",
]
forbidden_modules = [
  "pyelk.backends",
  "pyelk._native",
]

[[tool.importlinter.contracts]]
id = "reasoning-no-native"
name = "Python reasoning never imports the native extension"
type = "forbidden"
source_modules = ["pyelk.reasoning"]
forbidden_modules = ["pyelk._native"]

[[tool.importlinter.contracts]]
id = "runtime-no-test-oracle"
name = "Runtime package never imports tests or oracle tooling"
type = "forbidden"
source_modules = ["pyelk"]
forbidden_modules = ["tests", "tools"]
